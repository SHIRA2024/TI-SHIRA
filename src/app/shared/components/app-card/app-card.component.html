<div class="app-card"
     [routerLink]="['/app', app().id]">
 <div class="app-card-header">
  <div class="app-icon">
    <span class="icon-placeholder">{{ app().name.charAt(0) }}</span>
  </div>

  <div class="app-card-body">
    <h3 class="app-name">{{ app().name }}</h3>
    <p class="app-description">{{ app().description }}</p>
    <div class="app-meta">
          <span class="app-version">
      {{ app().installedVersion ?? app().version }}
    </span>
    </div>
  </div>
</div>
  
<div class="app-card-footer">
  <div class="action-buttons">

    @if (canInstall) {
      <button
        class="btn btn-primary"
        (click)="$event.stopPropagation(); handleInstall()">
        Install
      </button>
    }

    @if (canUpdate) {
      <button
        class="btn btn-warning"
        (click)="$event.stopPropagation(); handleUpdate()">
        Update
      </button>

      <button
        class="btn btn-dark"
        (click)="$event.stopPropagation(); handleRun()">
        Run
      </button>

      <button
        class="btn btn-danger"
        (click)="$event.stopPropagation(); handleUninstall()">
        Uninstall
      </button>
    }

    @if (canUninstall) {
      <button
        class="btn btn-dark"
        (click)="$event.stopPropagation(); handleRun()">
        Run
      </button>

      <button
        class="btn btn-danger"
        (click)="$event.stopPropagation(); handleUninstall()">
        Uninstall
      </button>
    }

  </div>
</div>
</div>
