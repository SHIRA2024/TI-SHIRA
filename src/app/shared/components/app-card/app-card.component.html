<div class="app-card">
  <div class="app-card-header">
    <div class="app-icon">
      <span class="icon-placeholder">{{ app().name.charAt(0) }}</span>
    </div>
    <app-status-badge [status]="app().status" />
  </div>
  
  <div class="app-card-body">
    <h3 class="app-name">{{ app().name }}</h3>
    <p class="app-description">{{ app().description }}</p>
    <div class="app-meta">
      <span class="app-version">v{{ app().version }}</span>
      <span class="app-unit">{{ app().businessUnit }}</span>
    </div>
  </div>
  
  <div class="app-card-footer">
    <a [routerLink]="['/app', app().id]" class="btn btn-secondary">View Details</a>
    <div class="action-buttons">
      @if (canInstall) {
        <button class="btn btn-primary" (click)="handleInstall()">Install</button>
      }
      @if (canUpdate) {
        <button class="btn btn-warning" (click)="handleUpdate()">Update</button>
      }
      @if (canUninstall) {
        <button class="btn btn-danger" (click)="handleUninstall()">Uninstall</button>
      }
    </div>
  </div>
</div>
