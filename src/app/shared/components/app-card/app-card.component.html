<div class="app-card">
 <div class="app-card-header">
  <div class="app-icon">
    <span class="icon-placeholder">{{ app().name.charAt(0) }}</span>
  </div>

  <div class="app-card-body">
    <h3 class="app-name">{{ app().name }}</h3>
    <p class="app-description">{{ app().description }}</p>
    <div class="app-meta">
          <span class="app-version">
      {{ app().installedVersion ?? app().version }}
    </span>
    </div>
  </div>
</div>
  
<div class="app-card-footer">
  <a [routerLink]="['/app', app().id]" class="details-link">
  View Details
  <span class="arrow">→</span>
</a>

  <div class="action-buttons">

  @if (canInstall) {
    <button class="btn btn-primary" (click)="handleInstall()">Install</button>
  }

  @if (canUpdate) {
    <button class="btn btn-warning" (click)="handleUpdate()">Update</button>
    
    <button class="btn btn-dark run-btn" (click)="handleRun()">
      @if (appService.runningAppId() === app().id) {
        <svg class="running-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 6.7 1.4z"/>
        </svg>
      } @else {
        Run
      }
    </button>

    <button class="btn btn-danger" (click)="handleUninstall()">Uninstall</button>
  }

  @if (canUninstall) {
    <button class="btn btn-dark run-btn" (click)="handleRun()">
      @if (appService.runningAppId() === app().id) {
        <svg class="running-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 6.7 1.4z"/>
        </svg>
      } @else {
        Run
      }
    </button>
    <button class="btn btn-danger" (click)="handleUninstall()">Uninstall</button>
  }

  </div>
</div>
</div>
