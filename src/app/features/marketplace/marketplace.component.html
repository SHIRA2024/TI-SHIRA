<div class="marketplace-container">
  <div class="marketplace-header">
    <div class="header-left">
      <h2 id="app-marketplace">Connectivity Toolbox</h2>
      <p class="subtitle">Discover and manage internal tools for the Connectivity team</p>
    </div>
    <div class="header-right">
      <div class="view-controls">
        <button
          class="view-btn"
          [class.active]="viewMode() === 'grid'"
          (click)="toggleViewMode()"
          title="Grid View">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
          </svg>
        </button>
        <button
          class="view-btn"
          [class.active]="viewMode() === 'list'"
          (click)="toggleViewMode()"
          title="List View">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
          </svg>
        </button>
      </div>
      <button class="refresh-btn" (click)="refreshApps()" title="Refresh Apps">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
      </button>
    </div>
  </div>

  <div class="marketplace-filters">
    <div class="filter-buttons">
      <button 
        class="filter-btn" 
        [class.active]="filterStatus() === 'all'"
        (click)="setFilterStatus('all')">
        All Apps ({{ apps().length }})
      </button>
      <button 
        class="filter-btn" 
        [class.active]="filterStatus() === 'installed'"
        (click)="setFilterStatus('installed')">
        Installed ({{ installedCount }})
      </button>
      <button 
        class="filter-btn" 
        [class.active]="filterStatus() === 'update-available'"
        (click)="setFilterStatus('update-available')">
        Updates Available ({{ updateAvailableCount }})
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="skeleton-grid">
      @for (_ of [1,2,3,4,5,6]; track $index) {
        <div class="skeleton-card">
          <div class="skeleton-top">
            <div class="skeleton-icon pulse"></div>
            <div class="skeleton-name-area">
              <div class="skeleton-name pulse"></div>
            </div>
          </div>
          <div class="skeleton-desc pulse"></div>
          <div class="skeleton-divider"></div>
          <div class="skeleton-row pulse"></div>
          <div class="skeleton-row pulse"></div>
          <div class="skeleton-link pulse"></div>
        </div>
      }
    </div>
  } @else if (filteredApps.length === 0) {
    <div class="empty-state">
      <p>No apps found matching your filter.</p>
    </div>
  } @else {
    <div class="apps-container" [class.grid-view]="viewMode() === 'grid'" [class.list-view]="viewMode() === 'list'">
      @for (app of filteredApps; track app.id) {
        <app-card [app]="app" />
      }
    </div>
  }
</div>
