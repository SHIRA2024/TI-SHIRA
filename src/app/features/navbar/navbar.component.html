<div class="navbar-container">
  <header class="navbar-header">
    <div class="header-content">
      <img src="/TI-Logos-RGB/One-Line/Reversed/ti_hz_1c_rev_rgb.svg" alt="Texas Instruments" class="navbar-logo" />
      <nav class="navbar-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          Marketplace
        </a>
        <a routerLink="/installed" routerLinkActive="active">
          Installed Apps
        </a>
      </nav>
    </div>
  </header>

  <div class="toast" *ngIf="toastMessage">
    {{ toastMessage }}
  </div>
  
  <main class="navbar-main">
    <router-outlet></router-outlet>
  </main>
</div> @if (appService.runningAppId()) {
  <div class="running-overlay">
    <span class="running-icon">🏃</span>
    <span class="running-text"> {{ appService.runningAppName() }} is running...</span>
  </div>
}

@if (notificationService.currentToast(); as toast) {
  <div class="toast-notification">
    <span class="toast-message">{{ toast.message }}</span>
    <button class="close-toast" (click)="notificationService.clearToast()">✕</button>
  </div>
}
