<div class="navbar-container">
  <header class="navbar-header">
    <div class="header-content">
      <img src="/TI-Logos-RGB/One-Line/Reversed/ti_hz_1c_rev_rgb.svg" alt="Texas Instruments" class="navbar-logo" />
    </div>
  </header>
  
  <main class="navbar-main">
    <router-outlet></router-outlet>
  </main>
</div> 

<div class="running-overlays-container">
  @for (runningApp of appService.runningAppDetails(); track runningApp.id) {
    <div class="running-overlay">
      <span class="running-icon">🏃</span>
      <span class="running-text">{{ runningApp.name }} is running...</span>
      <button class="stop-btn" (click)="appService.stopApp(runningApp.id)">✕</button>
    </div>
  }
</div>

@if (notificationService.currentToast(); as toast) {
  <div class="toast-notification">
    <span class="toast-message">{{ toast.message }}</span>
    <button class="close-toast" (click)="notificationService.clearToast()">✕</button>
  </div>
}
