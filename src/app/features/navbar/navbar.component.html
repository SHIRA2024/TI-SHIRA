<div class="navbar-container">
  <header class="navbar-header">
    <div class="header-content">
      <img src="/TI-Logos-RGB/One-Line/Reversed/ti_hz_1c_rev_rgb.svg" alt="Texas Instruments" class="navbar-logo" />
      <nav class="navbar-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          Marketplace
        </a>
        <a routerLink="/installed" routerLinkActive="active">
          Installed Apps
        </a>
      </nav>
    </div>
  </header>

  <div class="toast" *ngIf="toastMessage">
    {{ toastMessage }}
  </div>
  
  <main class="navbar-main">
    <router-outlet></router-outlet>
  </main>
</div>
